<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Dil haty çap</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/print-lock.css?v=1">
  <link rel="stylesheet" href="/css/contract-print.css?v=20">
  <link rel="stylesheet" href="/css/dil-haty-print.css?v=3">
</head>
<body data-no-fit="1" class="print-locked">
  <div class="no-print toolbar">
    <span class="toolbar-title">Dil haty çap</span>
    <button type="button" class="tb-back" data-print-back>← Yza</button>
    <button type="button" class="tb-print" data-print-do>Çap et</button>
    <button type="button" class="tb-word" data-print-word>Word ýükle</button>
    <button type="button" class="tb-close" data-print-close>Ýap</button>
    <p class="print-hint">
      Ähli PC-de birmeňzeş: <strong>A4</strong>,
      <strong>Masştab / Scale = 100%</strong>,
      <strong>Margins = Default</strong>,
      <strong>Колонтитулы / Headers and footers</strong> öçüriň.
      Çep 1,5 sm · Sag 1 sm.
    </p>
  </div>

  <div class="page" id="dil-haty-page">
    <p class="loading">Ýüklenýär...</p>
  </div>

  <script src="/js/print-nav.js?v=20"></script>
  <script src="/js/api.js?v=14"></script>
  <script src="/js/dil-haty-print.js?v=5"></script>
</body>
</html>
